name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check package contents
        run: npm pack --dry-run
      - name: Check versions match
        run: node scripts/check-version.mjs

  terraform-validate:
    name: terraform validate (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, azure, gcp, alibaba, oracle, ibm, digitalocean, tencent, huawei, cloudflare]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: npm ci
      - run: npm run build
      - name: Render and validate
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          npm run validate:terraform -- --provider ${{ matrix.provider }} --strict
