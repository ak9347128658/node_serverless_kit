version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    # @vitest/coverage-v8 peers the exact same vitest release. A split bump
    # fails `npm ci` with ERESOLVE. Vitest 5 also requires Node.js >= 22.12,
    # and CI still runs Node 20 (`engines` is >= 20.19). Bump both together,
    # and only after the Node 20 job is dropped.
    #
    # typescript-eslint 8 peers `typescript >=4.8.4 <6.1.0`. TypeScript 7.0
    # does not ship the compiler API that ESLint and tsup call, so a 7.x bump
    # fails `npm ci` with ERESOLVE in every job (PR 6). 6.0.x is still inside
    # that peer range, so only 7 and newer are ignored.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # Keep vitest and its packages in one PR so their exact peer versions match.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
