service: ts-paths

provider:
  name: aws
  region: us-east-1

package:
  tsconfig: tsconfig.json              # default when present; shown for clarity
  esbuild:
    loader:
      ".html": text                    # `import page from "./page.html"` -> string
  include:
    - templates/**                     # also ship the raw templates next to the bundle

functions:
  page:
    handler: src/handlers/pages.page
    events:
      - http: GET /page
      - http: GET /greet/{name}
  greet:
    handler: src/handlers/api.greet
    events:
      - http: GET /api/greeting

providers:
  gcp:
    region: us-central1
    options: {project: "${env:GOOGLE_CLOUD_PROJECT, my-gcp-project}"}
  azure:
    region: eastus
    options: {subscription_id: "${env:ARM_SUBSCRIPTION_ID, 00000000-0000-0000-0000-000000000000}"}
  cloudflare:
    options: {account_id: "${env:CLOUDFLARE_ACCOUNT_ID, 0123456789abcdef0123456789abcdef}"}
