# Copy this service onto a machine you control.
#
# This file uses deploy: bundle so `npx nskit package` writes a folder and
# does not open a connection. The README shows the other targets (local,
# SSH, a shipped Node binary, Docker, systemd).
#
#   npx nskit package
#   # .nskit/onprem-dev/onprem/bundle/
service: on-prem-deploy

provider:
  name: onprem
  region: local
  options:
    deploy: bundle
    runtime: auto
    http_port: 8080
    publish: 127.0.0.1

functions:
  health:
    handler: src/handlers.health
    events:
      - http: GET /health

providers:
  aws:
    region: us-east-1
  gcp:
    region: us-central1
    options: {project: "${env:GOOGLE_CLOUD_PROJECT, my-gcp-project}"}
  azure:
    region: eastus
    options: {subscription_id: "${env:ARM_SUBSCRIPTION_ID, 00000000-0000-0000-0000-000000000000}"}
